name: Android AAB (unsigned build)
on:
  workflow_dispatch:
  push:
    branches: [android]
    paths: ["android-app/**"]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Check static package preparation
        working-directory: android-app
        run: python3 scripts/verify-static.py
      - name: Install frontend dependencies
        working-directory: android-app
        run: npm install
      - name: Initialize Tauri Android project
        working-directory: android-app
        run: npx tauri android init
      - name: Build Android App Bundle
        working-directory: android-app
        run: npm run android:aab
      - name: Upload AAB artifact (not signed for Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: dino-crawler-android-aab-unsigned
          path: android-app/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          if-no-files-found: error
          retention-days: 14
