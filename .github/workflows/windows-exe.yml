name: Build Windows executable from v1.8.0
on:
  push:
    branches: [build/windows-v1.8.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Dino-Crawler-v1.8.0-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
